name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-22.04
            rid: linux-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release tag
        shell: python
        run: |
          import os, xml.etree.ElementTree as ET
          version = ET.parse('Directory.Build.props').findtext('.//Version')
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match Version'
      - name: Test
        run: dotnet test JsToCSharp.sln -c Release -m:1
      - name: Package
        run: python scripts/package_release.py --rid ${{ matrix.rid }} --output release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: C2X86-${{ matrix.rid }}
          path: release-assets/*
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create draft with downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --draft --verify-tag --title "C2X86 $RELEASE_TAG" --notes-file docs/release-notes-1.0.md
